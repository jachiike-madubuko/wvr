<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weavr Preview — Galaxy Field (Home)</title>
<style>
  :root {
    --bg: #05070e;
    --text: #f6f1ea;
    --muted: #8892b0;
    --card-bg: rgba(14, 20, 36, 0.75);
    --border: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    user-select: none;
  }
  /* Starfield Background */
  .stars {
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(1px 1px at 25px 35px, #fff, rgba(0,0,0,0)),
      radial-gradient(1.5px 1.5px at 120px 80px, #e2e8f0, rgba(0,0,0,0)),
      radial-gradient(1px 1px at 280px 220px, #94a3b8, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 450px 140px, #fff, rgba(0,0,0,0)),
      radial-gradient(1px 1px at 600px 300px, #cbd5e1, rgba(0,0,0,0)),
      radial-gradient(1.5px 1.5px at 800px 90px, #fff, rgba(0,0,0,0)),
      radial-gradient(1px 1px at 950px 250px, #94a3b8, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 1100px 180px, #fff, rgba(0,0,0,0)),
      radial-gradient(1px 1px at 1250px 380px, #e2e8f0, rgba(0,0,0,0));
    background-repeat: repeat;
    background-size: 600px 500px;
    opacity: 0.65;
  }
  .nebula {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(30, 45, 90, 0.4) 0%, rgba(5, 7, 14, 0.95) 75%);
    pointer-events: none;
  }

  /* Navigation Bar */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    background: rgba(10, 14, 26, 0.6);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    font-size: 15px;
  }
  .tab-group {
    display: flex;
    background: rgba(255, 255, 255, 0.06);
    padding: 3px;
    border-radius: 999px;
    gap: 2px;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn.active {
    background: #fff;
    color: #000;
  }

  /* Cluster & Student Nodes */
  .cluster {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .cluster-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 18px;
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    z-index: 5;
  }
  .cluster-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .cluster-title {
    font-size: 14px;
    font-weight: 700;
    font-family: Georgia, serif;
  }
  .cluster-count {
    font-size: 11px;
    color: var(--muted);
  }

  /* Orbital Student Nodes */
  .student-node {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: grab;
    transition: transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    z-index: 10;
  }
  .student-node:hover {
    transform: scale(1.18);
    z-index: 15;
  }
  .avatar-ring {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.6);
    position: relative;
  }
  .avatar-face {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #d4a373;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    border: 2px solid rgba(0,0,0,0.25);
  }
  .avatar-eyes {
    display: flex;
    gap: 8px;
    margin-bottom: 2px;
  }
  .avatar-eye {
    width: 3.5px;
    height: 3.5px;
    background: #2b1d0c;
    border-radius: 50%;
  }
  .avatar-mouth {
    width: 6px;
    height: 2px;
    background: #2b1d0c;
    border-radius: 1px;
  }
  .avatar-badge {
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1.5px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
  }

  .student-name {
    font-size: 11px;
    font-weight: 600;
    color: #cbd5e1;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .student-status {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .status-slow { color: #f87171; }
  .status-fast { color: #4ade80; }

  /* 500ms Popover */
  .popover {
    position: absolute;
    background: #111625;
    border: 1px solid #2a344d;
    border-radius: 16px;
    padding: 16px;
    width: 220px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    pointer-events: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 50;
  }
  .popover.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .popover-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .popover-kicker { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.08em; }
  .popover-content { font-size: 12px; color: #94a3b8; margin: 6px 0 12px; }
  .popover-btn {
    width: 100%;
    padding: 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Target Highlight Indicator */
  .drag-target {
    border: 2px dashed #4ade80;
    border-radius: 28px;
    background: rgba(74, 222, 128, 0.05);
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="nebula"></div>

<div class="top-bar">
  <div class="brand">
    <span>Weavr</span>
    <span style="font-size: 11px; padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,0.08);">Room 204</span>
  </div>
  <div class="tab-group">
    <button class="tab-btn active">Galaxy G</button>
    <button class="tab-btn" onclick="alert('Flip to Calendar')">Calendar C</button>
    <button class="tab-btn" onclick="alert('Switch to Play face')">Play P</button>
  </div>
  <div style="font-size: 12px; color: var(--muted);">Day / Night</div>
</div>

<!-- Cluster 1: Cooking (Coral) -->
<div class="cluster" style="top: 240px; left: 180px;">
  <div class="cluster-card">
    <div class="cluster-dot" style="background: #f87171;"></div>
    <span class="cluster-title">Cooking</span>
    <span class="cluster-count">4 kids</span>
  </div>
  <!-- Students around Cooking -->
  <div class="student-node" style="top: -65px; left: -50px;" onmouseenter="startHover('Taylor')" onmouseleave="endHover()">
    <div class="avatar-ring" style="border: 3px solid #f87171;"><div class="avatar-face"><div class="avatar-eyes"><div class="avatar-eye"></div><div class="avatar-eye"></div></div><div class="avatar-mouth"></div></div></div>
    <span class="student-name">Taylor</span>
  </div>
  <div class="student-node" style="top: -45px; left: 85px;" onmouseenter="startHover('Skyler')" onmouseleave="endHover()">
    <div class="avatar-ring" style="border: 3px solid #f87171;"><div class="avatar-face"><div class="avatar-eyes"><div class="avatar-eye"></div><div class="avatar-eye"></div></div><div class="avatar-mouth"></div></div></div>
    <span class="student-name">Skyler</span>
  </div>
  <div class="student-node" style="top: 45px; left: -65px;" onmouseenter="startHover('Sam')" onmouseleave="endHover()">
    <div class="avatar-ring" style="border: 3px solid #f87171;"><div class="avatar-face"><div class="avatar-eyes"><div class="avatar-eye"></div><div class="avatar-eye"></div></div><div class="avatar-mouth"></div></div></div>
    <span class="student-name">Sam</span>
  </div>
  <div class="student-node" style="top: 65px; left: 60px;" onmouseenter="startHover('Nico')" onmouseleave="endHover()">
    <div class="avatar-ring" style="border: 3px solid #f87171;"><div class="avatar-face"><div class="avatar-eyes"><div class="avatar-eye"></div><div class="avatar-eye"></div></div><div class="avatar-mouth"></div></div></div>
    <span class="student-name">Nico</span>
  </div>
</div>

<!-- Cluster 2: Video Games (Blue) - with Drag Target Box -->
<div class="cluster drag-target" style="top: 220px; left: 540px; padding: 30px 40px;">
  <div class="cluster-card">
    <div class="cluster-dot" style="background: #60a5fa;"></div>
    <span class="cluster-title">Video Games</span>
    <span class="cluster-count">2 kids</span>
  </div>
  <div class="student-node" style="top: -65px; left: 80px;" onmouseenter="startHover('Jordan', 'FAST')" onmouseleave="endHover()">
    <div class="avatar-ring" style="border: 3px solid #60a5fa;"><div class="avatar-face"><div class="avatar-eyes"><div class="avatar-eye"></div><div class="avatar-eye"></div></div><div class="avatar-mouth"></div></div></div>
    <span class="student-name">Jordan</span>
    <span class="student-status status-fast">FAST</span>
  </div>
  <div class="student-node" style="top: 75px; left: 80px;" onmouseenter="startHover('Avery')" onmouseleave="endHover()">
    <div class="avatar-ring" style="border: 3px solid #60a5fa;"><div class="avatar-face"><div class="avatar-eyes"><div class="avatar-eye"></div><div class="avatar-eye"></div></div><div class="avatar-mouth"></div></div></div>
    <span class="student-name">Avery</span>
  </div>
</div>

<!-- Cluster 3: Space (Sky Blue) -->
<div class="cluster" style="top: 220px; right: 200px;">
  <div class="cluster-card">
    <div class="cluster-dot" style="background: #38bdf8;"></div>
    <span class="cluster-title">Space</span>
    <span class="cluster-count">3 kids</span>
  </div>
  <div class="student-node" style="top: -65px; left: 40px;" onmouseenter="startHover('Quinn', 'SLOW')" onmouseleave="endHover()">
    <div class="avatar-ring" style="border: 3px solid #38bdf8;"><div class="avatar-face"><div class="avatar-eyes"><div class="avatar-eye"></div><div class="avatar-eye"></div></div><div class="avatar-mouth"></div></div></div>
    <span class="student-name">Quinn</span>
    <span class="student-status status-slow">SLOW</span>
  </div>
  <div class="student-node" style="top: 55px; left: -30px;" onmouseenter="startHover('Drew', 'SLOW')" onmouseleave="endHover()">
    <div class="avatar-ring" style="border: 3px solid #38bdf8;"><div class="avatar-face"><div class="avatar-eyes"><div class="avatar-eye"></div><div class="avatar-eye"></div></div><div class="avatar-mouth"></div></div></div>
    <span class="student-name">Drew</span>
    <span class="student-status status-slow">SLOW</span>
  </div>
  <div class="student-node" style="top: 55px; left: 100px;" onmouseenter="startHover('Morgan', 'FAST')" onmouseleave="endHover()">
    <div class="avatar-ring" style="border: 3px solid #38bdf8;"><div class="avatar-face"><div class="avatar-eyes"><div class="avatar-eye"></div><div class="avatar-eye"></div></div><div class="avatar-mouth"></div></div></div>
    <span class="student-name">Morgan</span>
    <span class="student-status status-fast">FAST</span>
  </div>
</div>

<!-- Hover Popover (500ms delay) -->
<div class="popover" id="popover">
  <div class="popover-name" id="pop-name">Sam</div>
  <div class="popover-kicker">Current Lesson Blocks</div>
  <div class="popover-content">No blocks today</div>
  <button class="popover-btn" onclick="alert('Navigate to /students/profile')">View profile</button>
</div>

<script>
let hoverTimer = null;
const popover = document.getElementById("popover");
const popName = document.getElementById("pop-name");

function startHover(name, status) {
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => {
    popName.textContent = name;
    const target = event.currentTarget.getBoundingClientRect();
    popover.style.left = `${target.left - 80}px`;
    popover.style.top = `${target.top - 120}px`;
    popover.classList.add("visible");
  }, 500); // 500ms required delay
}

function endHover() {
  clearTimeout(hoverTimer);
  popover.classList.remove("visible");
}
</script>

</body>
</html>
