<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weavr Block Deck Prototype</title>
<style>
  :root {
    --bg: #090a0f;
    --card-bg: #141721;
    --border: #232736;
    --text: #e2e8f0;
    --muted: #8b9bb4;
    --pin-hook: #3b82f6;
    --pin-try: #0ea5e9;
    --pin-check: #10b981;
    --pin-next: #a855f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .phone-frame {
    width: 100%;
    max-width: 400px;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 36px;
    padding: 20px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .progress-bar {
    display: flex;
    gap: 6px;
  }
  .step-pip {
    height: 4px;
    flex: 1;
    background: var(--border);
    border-radius: 2px;
    transition: background 0.2s;
  }
  .step-pip.done { background: var(--pin-check); }
  .step-pip.current { background: var(--pin-hook); }

  .card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 24px;
    border: 1px solid var(--border);
    min-height: 380px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .badge {
    align-self: flex-start;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 9999px;
    letter-spacing: 0.06em;
  }
  .badge-start { background: rgba(59, 130, 246, 0.2); color: var(--pin-hook); }
  .badge-try { background: rgba(14, 165, 233, 0.2); color: var(--pin-try); }
  .badge-check { background: rgba(16, 185, 129, 0.2); color: var(--pin-check); }
  .badge-next { background: rgba(168, 85, 247, 0.2); color: var(--pin-next); }

  .card-title {
    font-size: 20px;
    font-weight: 600;
    margin-top: 12px;
    line-height: 1.3;
  }
  .card-instr {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }

  .interactive-well {
    margin: 18px 0;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    justify-content: center;
  }
  .choice-btn {
    background: #1b2030;
    border: 1px solid #2a334a;
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .choice-btn:hover { background: #242c44; border-color: #3b476b; }
  .choice-btn.selected {
    background: rgba(16, 185, 129, 0.15);
    border-color: var(--pin-check);
    color: #6ee7b7;
    font-weight: 600;
  }

  canvas {
    background: #0d0f17;
    border: 1px dashed #2a334a;
    border-radius: 12px;
    width: 100%;
    height: 160px;
    touch-action: none;
    cursor: crosshair;
  }

  .cta-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    background: var(--pin-hook);
    color: #fff;
    transition: opacity 0.15s ease;
  }
  .cta-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .cta-btn.check-mode { background: var(--pin-check); }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="header">
    <span id="pack-title">Video Games · Room 204</span>
    <span id="step-count">1 of 4</span>
  </div>
  <div class="progress-bar" id="pips">
    <div class="step-pip current"></div>
    <div class="step-pip"></div>
    <div class="step-pip"></div>
    <div class="step-pip"></div>
  </div>

  <div class="card" id="card">
    <div>
      <span class="badge badge-start" id="badge">Start</span>
      <h2 class="card-title" id="title">Two rows at the arcade</h2>
      <p class="card-instr" id="instr">Read the setup before continuing.</p>
    </div>

    <div class="interactive-well" id="well">
      <!-- dynamic content per block -->
    </div>

    <button class="cta-btn" id="cta-btn">I read it</button>
  </div>
</div>

<script>
// Minimal block flow using data types from library.ts
const BLOCKS = [
  {
    role: "start",
    badge: "Start",
    title: "Two rows at the arcade",
    instr: "Read the story before your practice round.",
    cta: "I read it",
    render: (well, onValid) => {
      well.innerHTML = `<p style="font-size: 14px; line-height: 1.5; color: #cbd5e1;">Sam and Jordan have 8 tokens in the top row and 8 tokens in the bottom row. Let's count them together!</p>`;
      onValid(true);
    }
  },
  {
    role: "try",
    badge: "Try",
    title: "Draw the two rows",
    instr: "Draw 8 tokens, then 8 more under them.",
    cta: "Save my drawing",
    render: (well, onValid) => {
      well.innerHTML = `<canvas id="draw-pad" width="320" height="160"></canvas><p style="font-size: 11px; color: #64748b; text-align: center;">Touch or drag to draw</p>`;
      const cvs = document.getElementById("draw-pad");
      const ctx = cvs.getContext("2d");
      let drawing = false;
      let drawn = false;

      function pos(e) {
        const r = cvs.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return [t.clientX - r.left, t.clientY - r.top];
      }
      function start(e) { drawing = true; draw(e); }
      function stop() { drawing = false; ctx.beginPath(); }
      function draw(e) {
        if (!drawing) return;
        const [x, y] = pos(e);
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#38bdf8";
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
        if (!drawn) { drawn = true; onValid(true); }
      }
      cvs.onmousedown = start;
      cvs.onmouseup = stop;
      cvs.onmousemove = draw;
      cvs.ontouchstart = (e) => { e.preventDefault(); start(e); };
      cvs.ontouchend = stop;
      cvs.ontouchmove = (e) => { e.preventDefault(); draw(e); };
    }
  },
  {
    role: "check",
    badge: "Check",
    title: "Which shot count is right?",
    instr: "Pick the number sentence that matches the two rows of 8.",
    cta: "Lock in my answer",
    render: (well, onValid) => {
      const choices = [
        "8 + 8 = 16",
        "8 + 6 = 14",
        "8 × 8 = 64",
        "16 + 8 = 24"
      ];
      well.innerHTML = choices.map((c, i) => `<button class="choice-btn" data-idx="${i}">${c}</button>`).join("");
      well.querySelectorAll(".choice-btn").forEach(btn => {
        btn.onclick = () => {
          well.querySelectorAll(".choice-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          onValid(true);
        };
      });
    }
  },
  {
    role: "next",
    badge: "Next",
    title: "Ready for the next lesson!",
    instr: "Great job completing your blocks today.",
    cta: "Finish & Return",
    render: (well, onValid) => {
      well.innerHTML = `<div style="text-align: center; padding: 24px 0;"><span style="font-size: 48px;">🏆</span><p style="font-size: 15px; font-weight: 600; margin-top: 12px; color: #a855f7;">Block Set Complete</p></div>`;
      onValid(true);
    }
  }
];

let curr = 0;
const pipsEl = document.getElementById("pips");
const badgeEl = document.getElementById("badge");
const titleEl = document.getElementById("title");
const instrEl = document.getElementById("instr");
const wellEl = document.getElementById("well");
const ctaBtn = document.getElementById("cta-btn");
const stepCountEl = document.getElementById("step-count");

function loadBlock(idx) {
  const b = BLOCKS[idx];
  stepCountEl.textContent = `${idx + 1} of ${BLOCKS.length}`;
  badgeEl.textContent = b.badge;
  badgeEl.className = `badge badge-${b.role}`;
  titleEl.textContent = b.title;
  instrEl.textContent = b.instr;
  ctaBtn.textContent = b.cta;
  ctaBtn.className = `cta-btn ${b.role === "check" ? "check-mode" : ""}`;
  ctaBtn.disabled = b.role === "check" || b.role === "try";

  Array.from(pipsEl.children).forEach((pip, i) => {
    pip.className = `step-pip ${i < idx ? "done" : i === idx ? "current" : ""}`;
  });

  b.render(wellEl, (valid) => {
    ctaBtn.disabled = !valid;
  });
}

ctaBtn.onclick = () => {
  if (curr < BLOCKS.length - 1) {
    curr++;
    loadBlock(curr);
  } else {
    curr = 0;
    loadBlock(curr);
  }
};

loadBlock(0);
</script>
</body>
</html>
