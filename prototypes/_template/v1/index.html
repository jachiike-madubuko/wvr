<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>WVR-000 · v1 placeholder</title>
  <style>
    :root {
      --bg: #090c15;
      --card: #121726;
      --border: #232c42;
      --text: #f6f1ea;
      --muted: #8a9bb5;
      --accent: #58b6fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      line-height: 1.45;
    }
    main {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      font-size: 1.6rem;
      letter-spacing: -0.02em;
    }
    p { color: var(--muted); font-size: 0.95rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
    }
    .card strong { color: var(--text); }
    button, .btn {
      display: block;
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #082033;
      font: inherit;
      font-weight: 700;
      padding: 12px 16px;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <p class="eyebrow">WVR-000 · v1</p>
      <h1>Prototype placeholder</h1>
      <p style="margin-top: 8px;">Replace this file with a self-contained, phone-first variation. Do not import from the app. Do not add a build step.</p>
    </div>
    <div class="card">
      <p><strong>What this variation is testing</strong></p>
      <p style="margin-top: 6px;">Write the hypothesis here so Jah can read it on a phone.</p>
    </div>
    <button type="button">Primary action (replace me)</button>
  </main>
</body>
</html>
